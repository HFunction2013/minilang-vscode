name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout vscode extension
        uses: actions/checkout@v4

      - name: Checkout boot toolchain (sibling)
        uses: actions/checkout@v4
        with:
          repository: HFunction2013/minilang-boot
          ref: ${{ github.head_ref || github.ref_name }}
          path: minilang-boot

      - name: Checkout compiler (syslib)
        uses: actions/checkout@v4
        with:
          repository: HFunction2013/minilang-compiler
          ref: ${{ github.head_ref || github.ref_name }}
          path: minilang-compiler
          submodules: true

      - name: Build boot (Unix)
        if: runner.os != 'Windows'
        working-directory: minilang-boot
        run: make

      - name: Build boot (Windows, MSVC)
        if: runner.os == 'Windows'
        working-directory: minilang-boot
        shell: bash
        run: cmake -B build && cmake --build build --config Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MINILANG_BIN: ${{ github.workspace }}/minilang-boot/minilang
          MINILANG_DIR: ${{ github.workspace }}/minilang-compiler
        run: npm run smoke

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MINILANG_BIN: ${{ github.workspace }}/minilang-boot/build/Release/minilang.exe
          MINILANG_DIR: ${{ github.workspace }}/minilang-compiler
        run: npm run smoke
